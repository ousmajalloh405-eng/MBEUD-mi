# Lance : base PostGIS + API FastAPI + dashboard Streamlit.
# Usage : cp .env.example .env && docker compose up --build
services:
  db:
    image: postgis/postgis:16-3.4
    container_name: flood_db
    env_file: .env
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/20_schema.sql:ro

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: flood_api
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  dashboard:
    build:
      context: .
      dockerfile: docker/Dockerfile.dashboard
    container_name: flood_dashboard
    environment:
      API_URL: http://api:8000
    ports:
      - "${DASHBOARD_PORT:-8501}:8501"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
